<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add downloads — MyPersonalDownloadManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --frame: #1a2129;
        --panel: #222b35;
        --panelhi: #2b3643;
        --well: #0c1116;
        --bevel: #2e3946;
        --bevel-lo: #141b22;
        --text: #e6ebf0;
        --text2: #a9b4c1;
        --text3: #8b97a5;
        --amber: #ffa62b;
        --ink: #1c1203;
        --cyan: #3be0ff;
        --green: #6bd66f;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "Barlow", system-ui, sans-serif;
        font-size: 13px; line-height: 1.45;
        margin: 0; background: var(--frame); color: var(--text);
        display: flex; flex-direction: column; min-height: 100vh;
      }
      /* ---- title bar ---- */
      .titlebar {
        display: flex; align-items: center; gap: 10px;
        padding: 0 14px; height: 52px; flex: none;
        background: var(--panel);
        border-bottom: 1px solid var(--bevel);
      }
      .titlebar svg { width: 26px; height: 26px; flex: none; }
      .titlebar h1 {
        font-family: "Chakra Petch", sans-serif;
        font-size: 16px; font-weight: 600; letter-spacing: 0.01em; margin: 0; flex: 1;
      }
      .x {
        color: var(--text3); font-size: 18px; cursor: pointer;
        width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      }
      .x:hover { color: var(--text); }
      /* ---- body ---- */
      .body { padding: 18px; flex: 1; overflow: auto; }
      label {
        display: block; margin: 0 0 7px;
        font-family: "Chakra Petch", sans-serif;
        font-size: 10.5px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase;
        color: var(--text3);
      }
      .field { margin-bottom: 16px; }
      textarea, input[type="text"], select {
        width: 100%; padding: 11px 12px;
        font-family: "JetBrains Mono", monospace; font-size: 13px;
        color: var(--text); background: var(--well);
        border: 1px solid var(--bevel); outline: none; resize: none;
      }
      textarea { min-height: 84px; line-height: 1.5; }
      textarea:focus, input:focus, select:focus {
        border-color: var(--amber);
        box-shadow: 0 0 0 1px var(--amber), 0 0 18px rgba(255, 166, 43, 0.15);
      }
      .hint { color: var(--text3); font-size: 12px; margin: 7px 2px 0; }
      /* select chevron */
      .sel { position: relative; }
      .sel::after {
        content: ""; position: absolute; right: 14px; top: 50%;
        width: 8px; height: 8px; margin-top: -6px; pointer-events: none;
        border-right: 2px solid var(--text3); border-bottom: 2px solid var(--text3);
        transform: rotate(45deg);
      }
      select { appearance: none; -webkit-appearance: none; cursor: pointer; }
      /* input + browse button row */
      .inrow { display: flex; gap: 8px; }
      .inrow input { flex: 1; min-width: 0; }
      .iconbtn {
        flex: none; width: 42px; padding: 0; display: flex; align-items: center; justify-content: center;
        background: var(--panelhi); color: var(--text2); border: 1px solid var(--bevel); cursor: pointer;
        clip-path: none;
      }
      .iconbtn:hover { border-color: var(--amber); color: var(--amber); }
      .iconbtn svg { width: 18px; height: 18px; }
      /* ---- expansion preview ---- */
      .preview {
        background: var(--well); border: 1px solid var(--bevel);
        padding: 14px 16px; margin-bottom: 16px; display: none;
      }
      .preview.show { display: block; }
      .preview .top { display: flex; align-items: center; gap: 9px; }
      .preview .top svg { width: 17px; height: 17px; color: var(--cyan); flex: none; }
      .preview .lbl {
        font-family: "Chakra Petch", sans-serif; font-size: 13px; font-weight: 600;
        letter-spacing: 0.02em; color: var(--text2); flex: 1;
      }
      .preview .lbl b { color: var(--cyan); }
      .preview .showall {
        font-family: "Chakra Petch", sans-serif; font-size: 11px; font-weight: 600;
        letter-spacing: 0.08em; color: var(--amber); cursor: pointer; text-transform: uppercase;
        background: none; border: 0; padding: 0;
      }
      .preview .showall:hover { filter: brightness(1.15); }
      .preview ul {
        list-style: none; margin: 11px 0 0; padding: 0;
        font-family: "JetBrains Mono", monospace; font-size: 12.5px; color: var(--text2);
      }
      .preview li { padding: 1px 0; }
      .preview li.more { color: var(--text3); }
      /* ---- two-column grid ---- */
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
      @media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }
      /* ---- checkboxes ---- */
      .check {
        display: flex; gap: 11px; align-items: flex-start; margin-top: 16px; cursor: pointer;
        text-transform: none; letter-spacing: normal; /* don't inherit the field-label casing */
      }
      .check .box {
        width: 20px; height: 20px; flex: none; margin-top: 1px;
        background: var(--well); border: 1px solid var(--bevel);
        display: flex; align-items: center; justify-content: center;
      }
      .check input { display: none; }
      .check .box svg { width: 13px; height: 13px; color: var(--ink); display: none; }
      .check input:checked + .box { background: var(--amber); border-color: var(--amber); }
      .check input:checked + .box svg { display: block; }
      .check .txt .t {
        font-family: "Barlow", sans-serif; font-size: 14px; font-weight: 600; color: var(--text);
      }
      .check .txt .d { color: var(--text3); font-size: 12.5px; margin-top: 1px; }
      /* ---- footer ---- */
      .footer {
        display: flex; align-items: center; gap: 10px;
        padding: 0 16px; height: 66px; flex: none;
        background: var(--panel); border-top: 1px solid var(--bevel);
      }
      .footer .note { color: var(--text3); font-size: 12.5px; flex: 1; }
      button {
        font-family: "Chakra Petch", sans-serif;
        font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
        padding: 11px 20px; cursor: pointer;
        background: var(--well); color: var(--text); border: 1px solid var(--bevel);
        clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
      }
      button:hover { border-color: var(--amber); color: var(--amber); }
      button.primary {
        background: var(--amber); color: var(--ink); border-color: var(--amber);
        display: flex; align-items: center; gap: 8px;
      }
      button.primary:hover { filter: brightness(1.08); color: var(--ink); }
      button.primary svg { width: 15px; height: 15px; }
    </style>
  </head>
  <body>
    <div class="body">
      <div class="field">
        <label for="links">Links</label>
        <textarea id="links" spellcheck="false"></textarea>
        <p class="hint">One link per line. Add a range like [1-100], [001-120] or [a-e] to fetch a numbered series.</p>
      </div>

      <div class="preview" id="preview">
        <div class="top">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 6h13M3 12h9M3 18h9" /><path d="M17 15v6M14 18h6" />
          </svg>
          <span class="lbl" id="previewLbl"></span>
          <button class="showall" id="showAll" type="button">Show all</button>
        </div>
        <ul id="previewList"></ul>
      </div>

      <div class="grid">
        <div class="field">
          <label for="saveto">Save to</label>
          <div class="inrow">
            <input type="text" id="saveto" placeholder="Default download folder" spellcheck="false" />
            <button type="button" id="browse" class="iconbtn" title="Save as… (choose a folder and name)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.5l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="connections">Connections per file</label>
          <div class="sel">
            <select id="connections">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="8" selected>8</option>
              <option value="16">16</option>
              <option value="32">32</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="speed">Speed limit per file</label>
          <input type="text" id="speed" placeholder="Unlimited" spellcheck="false" />
        </div>
        <div class="field">
          <label for="rename">Rename</label>
          <input type="text" id="rename" placeholder="Keep original name" spellcheck="false" />
        </div>
      </div>

      <label class="check" for="incognito">
        <input type="checkbox" id="incognito" />
        <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6" /></svg></span>
        <span class="txt">
          <span class="t">Incognito</span>
          <span class="d">Save into a hidden folder and leave no entry in your history.</span>
        </span>
      </label>

      <label class="check" for="browserua">
        <input type="checkbox" id="browserua" checked />
        <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6" /></svg></span>
        <span class="txt">
          <span class="t">Identify as a web browser</span>
          <span class="d">Some servers block download tools. MPDM is honest about itself by default.</span>
        </span>
      </label>
    </div>

    <div class="footer">
      <span class="note">Joins the queue, 5 run at a time</span>
      <button id="cancel" type="button">Cancel</button>
      <button id="download" class="primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span id="addLabel">Add download</span>
      </button>
    </div>

    <script src="confirm.js"></script>
  </body>
</html>
