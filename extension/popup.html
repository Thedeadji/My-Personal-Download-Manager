<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyPersonalDownloadManager</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.45 system-ui, sans-serif;
        width: 260px; margin: 0; padding: 14px;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .sub { opacity: 0.65; margin: 0 0 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
      button { font: inherit; padding: 6px 10px; cursor: pointer; }
      .status { margin-top: 10px; padding: 8px; border-radius: 6px; background: rgba(127,127,127,.12); }
      .ok { color: #1a7f37; } .bad { color: #cf222e; }
      .hint { opacity:.6; font-size:12px; margin-top:10px; }
      input[type="checkbox"] { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <h1>MyPersonalDownloadManager</h1>
    <p class="sub">Browser integration</p>

    <div class="row">
      <label for="confirm">Ask before each download</label>
      <input type="checkbox" id="confirm" />
    </div>

    <div class="row">
      <label for="intercept">Capture all browser downloads</label>
      <input type="checkbox" id="intercept" />
    </div>

    <div class="row">
      <label for="videoPanel">Show video download panel on pages</label>
      <input type="checkbox" id="videoPanel" />
    </div>

    <div class="row">
      <button id="ping">Test connection to host</button>
    </div>

    <div class="status" id="status">Right-click any link, image, or media and
      choose “Download with MyPersonalDownloadManager”.</div>

    <p class="hint">The host app must be installed (run <code>install_host.py</code>).</p>

    <script src="popup.js"></script>
  </body>
</html>
